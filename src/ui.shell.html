<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script>document.documentElement.classList.add(window.parent !== window ? 'in-figma' : 'standalone');</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Design → Figma</title>
<meta name="description" content="Turn Claude Design exports into editable Figma layers. Free, runs in your browser, nothing is uploaded.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='9' width='12' height='12' rx='3' fill='%23d97757'/%3E%3Crect x='18' y='9' width='12' height='12' rx='1' fill='none' stroke='%230d99ff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
  :root {
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --canvas: #f3f1ec; --dot: rgba(28, 27, 25, .085);
    --card: #ffffff; --card-2: #f7f5f1;
    --ink: #1c1b19; --ink-2: #6e6a63; --ink-3: #9b968d;
    --line: #e5e1d9; --line-2: #d6d1c7;
    --sel: #0d99ff; --sel-soft: rgba(13, 153, 255, .1);
    --clay: #d97757; --clay-ink: #b4532f; --clay-soft: rgba(217, 119, 87, .12);
    --ok: #13924f; --ok-soft: rgba(19, 146, 79, .1);
    --warn-ink: #8a5600; --warn-soft: #fff3dc;
    --err: #d33a1c; --err-soft: rgba(211, 58, 28, .08);
    --shadow: 0 1px 2px rgba(28, 27, 25, .05), 0 4px 16px -6px rgba(28, 27, 25, .1);
    --display: 'Bricolage Grotesque', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
    --body: 'Geist', ui-sans-serif, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --serif: 'Instrument Serif', 'Iowan Old Style', Georgia, serif;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) { :root:not(.figma-light) { --dark: 1; } }
  html.figma-dark, :root:not(.figma-light):not(.figma-dark) { }
  html.figma-dark {
    --canvas: #1e1e1e; --dot: rgba(255, 255, 255, .06);
    --card: #2a2a2a; --card-2: #323232;
    --ink: #f2f0eb; --ink-2: #aaa59c; --ink-3: #7d786f;
    --line: #3b3b3b; --line-2: #4a4a4a;
    --clay-ink: #f09a7a; --clay-soft: rgba(217, 119, 87, .18);
    --ok: #3ccb7f; --ok-soft: rgba(60, 203, 127, .14);
    --warn-ink: #ffc56b; --warn-soft: rgba(255, 184, 77, .12);
    --err: #ff7a5c; --err-soft: rgba(255, 122, 92, .12);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -8px rgba(0, 0, 0, .5);
  }
  @media (prefers-color-scheme: dark) {
    html:not(.figma-light):not(.in-figma) {
      --canvas: #1e1e1e; --dot: rgba(255, 255, 255, .06);
      --card: #2a2a2a; --card-2: #323232;
      --ink: #f2f0eb; --ink-2: #aaa59c; --ink-3: #7d786f;
      --line: #3b3b3b; --line-2: #4a4a4a;
      --clay-ink: #f09a7a; --clay-soft: rgba(217, 119, 87, .18);
      --ok: #3ccb7f; --ok-soft: rgba(60, 203, 127, .14);
      --warn-ink: #ffc56b; --warn-soft: rgba(255, 184, 77, .12);
      --err: #ff7a5c; --err-soft: rgba(255, 122, 92, .12);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px -8px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 13px/1.5 var(--body); color: var(--ink); background-color: var(--canvas);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
    background-size: 16px 16px; background-position: -8px -8px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { max-width: 460px; margin: 0 auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  html.standalone .app { padding-top: 48px; padding-bottom: 64px; }

  /* ---------- header ---------- */
  .head { display: flex; align-items: center; gap: 12px; padding: 2px 2px 6px; }
  .mark { display: flex; align-items: center; gap: 5px; flex: none; }
  .mark i { display: block; width: 14px; height: 14px; border-radius: 4px; background: var(--clay); }
  .mark b { display: block; width: 14px; height: 14px; border: 1.5px solid var(--sel); border-radius: 2px; position: relative; }
  .mark b::before, .mark b::after { content: ''; position: absolute; width: 4px; height: 4px; background: var(--card); border: 1px solid var(--sel); }
  .mark b::before { left: -3px; top: -3px; } .mark b::after { right: -3px; bottom: -3px; }
  .mark svg { color: var(--ink-3); }
  .head h1 { font: 700 17px/1.1 var(--display); letter-spacing: -.01em; margin: 0; }
  .head .mode { margin-left: auto; font: 500 10.5px/1 var(--mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line-2); padding: 5px 7px; border-radius: 999px; background: var(--card); white-space: nowrap; }
  .head .mode.plugin { color: var(--sel); border-color: color-mix(in srgb, var(--sel) 35%, transparent); }

  /* ---------- step cards ---------- */
  .step { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; animation: rise 280ms var(--ease-out) both; }
  .step:nth-of-type(2) { animation-delay: .05s; } .step:nth-of-type(3) { animation-delay: .1s; } .step:nth-of-type(4) { animation-delay: .15s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .step-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .num { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 11px/1 var(--mono); background: var(--card-2); color: var(--ink-2); border: 1px solid var(--line); transition: background-color .2s ease-out, border-color .2s ease-out, color .2s ease-out; }
  .step.done .num { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .step.done .num span { display: none; }
  .step.done .num::after { content: ''; width: 8px; height: 4px; border: 2px solid currentColor; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
  .step-h h2 { margin: 0; font: 600 14px/1.2 var(--display); letter-spacing: -.005em; }
  .step-h .aside { margin-left: auto; color: var(--ink-3); font-size: 12px; }
  .linkbtn { background: none; border: 0; padding: 2px 0; color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; font-size: 12px; }
  .linkbtn:hover { color: var(--ink); text-decoration-color: currentColor; }

  /* ---------- drop zone = a selected Figma frame ---------- */
  .drop { position: relative; display: block; width: 100%; padding: 26px 16px 22px; text-align: center; background: var(--sel-soft); border: 1.5px dashed color-mix(in srgb, var(--sel) 45%, transparent); border-radius: 4px; transition: background-color .2s ease-out, border-color .2s ease-out, transform .2s var(--ease-out); }
  .drop.over { border-style: solid; border-color: var(--sel); background: color-mix(in srgb, var(--sel) 16%, transparent); transform: scale(1.01); }
  .drop .h { position: absolute; width: 8px; height: 8px; background: var(--card); border: 1.5px solid var(--sel); opacity: 0; transition: opacity .2s; }
  .drop.over .h { opacity: 1; }
  .drop .h.tl { left: -5px; top: -5px; } .drop .h.tr { right: -5px; top: -5px; } .drop .h.bl { left: -5px; bottom: -5px; } .drop .h.br { right: -5px; bottom: -5px; }
  .drop .tag { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); font: 500 10px/1 var(--mono); background: var(--sel); color: #fff; padding: 4px 6px; border-radius: 3px; white-space: nowrap; }
  .drop .ico { width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 10px; display: grid; place-items: center; background: var(--card); color: var(--sel); box-shadow: var(--shadow); transition: transform .2s var(--ease-out); }
  .drop.over .ico { transform: translateY(-3px); }
  .drop strong { display: block; font: 600 14px/1.3 var(--display); }
  .drop small { display: block; color: var(--ink-2); margin-top: 3px; font-size: 12px; }
  .drop kbd, .kbd { font: 500 10.5px/1 var(--mono); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--card); color: var(--ink-2); }

  .paste-wrap { margin-top: 12px; }
  textarea { width: 100%; height: 110px; resize: vertical; font: 11.5px/1.45 var(--mono); padding: 10px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card-2); }
  .paste-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; color: var(--ink-3); font-size: 11.5px; }

  /* file card */
  .file { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); }
  .file .fi { width: 38px; height: 44px; flex: none; border-radius: 6px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: end center; padding-bottom: 6px; font: 600 9px/1 var(--mono); color: var(--clay-ink); position: relative; text-transform: uppercase; }
  .file .fi::before { content: ''; position: absolute; top: 7px; left: 8px; right: 8px; height: 14px; border-radius: 3px; background: var(--clay-soft); }
  .file .meta { min-width: 0; flex: 1; }
  .file .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .info { color: var(--ink-2); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
  .file .info b { font-weight: 500; color: var(--clay-ink); }
  .iconbtn { width: 28px; height: 28px; flex: none; border-radius: 7px; border: 1px solid transparent; background: none; color: var(--ink-2); display: grid; place-items: center; }
  .iconbtn:hover { background: var(--card); border-color: var(--line); color: var(--ink); }

  .pages { margin-top: 10px; display: grid; gap: 2px; max-height: 132px; overflow: auto; }
  .pages label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
  .pages label:hover { background: var(--card-2); }
  .pages .p { font: 500 11.5px/1.3 var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  input[type=checkbox] { accent-color: var(--ink); width: 14px; height: 14px; margin: 0; }

  /* ---------- sizes ---------- */
  .sizes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .size { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 9px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; user-select: none; }
  .size:hover { border-color: var(--line-2); background: var(--card-2); }
  .size:active { transform: scale(.97); }
  .size input { position: absolute; opacity: 0; pointer-events: none; }
  .size .dev { height: 24px; display: grid; place-items: end center; color: var(--ink-3); transition: color .15s; }
  .size .nm { font-weight: 500; font-size: 12px; }
  .size .px { font: 500 10.5px/1 var(--mono); color: var(--ink-3); }
  .size:has(input:checked) { border-color: var(--ink); background: var(--card-2); box-shadow: inset 0 0 0 1px var(--ink); }
  .size:has(input:checked) .dev { color: var(--clay); }
  .size:has(input:focus-visible) { outline: 2px solid var(--sel); outline-offset: 2px; }
  .size.custom input[type=number] { position: static; opacity: 1; pointer-events: auto; width: 100%; max-width: 64px; text-align: center; border: 0; border-bottom: 1px dashed var(--line-2); background: transparent; font: 500 11px/1.4 var(--mono); padding: 0; outline: none; -moz-appearance: textfield; }
  .size.custom input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .hint { color: var(--ink-3); font-size: 11.5px; margin-top: 8px; }

  .boards { display: grid; gap: 6px; }
  .board { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; }
  .board .thumb { flex: none; width: 28px; height: 28px; display: grid; place-items: center; }
  .board .thumb i { display: block; border: 1.5px solid var(--sel); border-radius: 2px; background: var(--sel-soft); }
  .board .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .board .d { font: 500 10.5px/1 var(--mono); color: var(--ink-2); background: var(--card-2); padding: 4px 6px; border-radius: 4px; }

  /* ---------- fine-tune ---------- */
  details.tune { border-top: 1px dashed var(--line); margin-top: 14px; padding-top: 10px; }
  details.tune summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; font-weight: 500; }
  details.tune summary::-webkit-details-marker { display: none; }
  details.tune summary svg { transition: transform 150ms var(--ease-out); }
  details.tune[open] summary svg { transform: rotate(90deg); }
  .opts { display: grid; gap: 2px; margin-top: 8px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 7px 2px; }
  .opt .lbl { flex: 1; }
  .opt .lbl small { display: block; color: var(--ink-3); font-size: 11.5px; }
  .switch { position: relative; width: 30px; height: 18px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); transition: background-color .15s ease-out; }
  .switch span::after { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 150ms var(--ease-out); }
  .switch input:checked + span { background: var(--ink); }
  html.figma-dark .switch input:checked + span { background: var(--clay); }
  .switch input:checked + span::after { transform: translateX(12px); }
  .switch input:focus-visible + span { outline: 2px solid var(--sel); outline-offset: 2px; }
  .num-in { width: 72px; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--card-2); font: 500 12px/1.2 var(--mono); text-align: right; }

  /* ---------- go ---------- */
  .go { position: relative; width: 100%; padding: 13px 16px; border-radius: 11px; border: 0; background: var(--ink); color: var(--card); font: 600 14px/1.2 var(--display); letter-spacing: .005em; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s var(--ease-out), opacity .2s ease-out, box-shadow .2s ease-out; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 6px 16px -8px rgba(28,27,25,.6); }
  html.figma-dark .go, html.standalone .go.alt { }
  .go:active:not(:disabled) { transform: translateY(0) scale(.99); }
  .go:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  .go .arrow { display: inline-flex; transition: transform .2s var(--ease-out); }
  .go.clay { background: var(--clay); color: #fff; }
  .go.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line-2); box-shadow: none; }
  .why { text-align: center; color: var(--ink-3); font-size: 11.5px; margin-top: -4px; min-height: 16px; }

  /* ---------- progress ---------- */
  .work { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
  .pv { position: relative; padding-top: 16px; }
  .pv .fl { position: absolute; top: 0; left: 0; right: 0; font: 500 10px/1 var(--mono); color: var(--sel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv .box { position: relative; height: 150px; overflow: hidden; background: var(--card-2); outline: 1.5px solid var(--sel); border-radius: 1px; }
  .pv .box::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 60px; background: linear-gradient(180deg, transparent 0%, var(--sel-soft) 50%, transparent 100%); transform: translateY(-60px); animation: scan 1.6s ease-in-out infinite; pointer-events: none; will-change: transform; }
  .work.finished .pv .box::after { display: none; }
  @keyframes scan { from { transform: translateY(-60px); } to { transform: translateY(160px); } }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  .stage iframe { border: 0; background: #fff; display: block; }
  .phases { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  .phases li { display: flex; align-items: center; gap: 9px; color: var(--ink-3); font-size: 12.5px; transition: color .2s; }
  .phases li .st { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; transition: background-color .15s ease-out, border-color .15s ease-out; }
  .phases li.now { color: var(--ink); font-weight: 500; }
  .phases li.now .st { border-color: var(--sel); border-right-color: transparent; animation: spin .8s linear infinite; }
  .phases li.ok { color: var(--ink-2); }
  .phases li.ok .st { background: var(--ok); border-color: var(--ok); }
  .phases li.ok .st::after { content: ''; width: 6px; height: 3px; border: 1.5px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(0.5px, -0.5px); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { height: 4px; border-radius: 999px; background: var(--card-2); overflow: hidden; margin-top: 14px; }
  .bar i { display: block; height: 100%; width: 100%; transform: scaleX(0); transform-origin: left center; background: linear-gradient(90deg, var(--clay), var(--sel)); border-radius: inherit; transition: transform 250ms var(--ease-out); }
  .status { margin-top: 8px; font: 500 11px/1.4 var(--mono); color: var(--ink-2); min-height: 15px; overflow-wrap: anywhere; }
  .status.err { color: var(--err); } .status.ok { color: var(--ok); }

  /* ---------- result ---------- */
  .result { text-align: center; padding: 22px 16px 16px; }
  .badge { width: 52px; height: 52px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); animation: pop 300ms var(--ease-out) both; }
  .badge.err { background: var(--err-soft); color: var(--err); }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .result h3 { margin: 0; font: 700 20px/1.2 var(--display); letter-spacing: -.015em; }
  .result p.sum { margin: 6px 0 0; color: var(--ink-2); }
  .stats { display: flex; justify-content: center; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
  .stats span { font: 500 11px/1 var(--mono); padding: 6px 8px; border-radius: 6px; background: var(--card-2); border: 1px solid var(--line); color: var(--ink-2); }
  .stats b { color: var(--ink); font-weight: 600; }
  .actions { display: grid; gap: 8px; margin-top: 16px; }
  .actions.two { grid-template-columns: 1.4fr 1fr; }
  .how { list-style: none; counter-reset: h; margin: 16px 0 0; padding: 12px; text-align: left; display: grid; gap: 8px; background: var(--card-2); border-radius: 10px; }
  .how li { counter-increment: h; display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--ink-2); }
  .how li::before { content: counter(h); flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font: 600 10px/1 var(--mono); background: var(--card); border: 1px solid var(--line); color: var(--ink); transform: translateY(3px); }
  .how b { color: var(--ink); font-weight: 600; }
  .note { margin-top: 12px; text-align: left; padding: 10px 12px; border-radius: 9px; font-size: 12px; line-height: 1.45; background: var(--warn-soft); color: var(--warn-ink); }
  .note.info { background: var(--sel-soft); color: var(--ink-2); }
  .note b { font-weight: 600; }

  .toast { position: fixed; left: 50%; bottom: 16px; transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--card); padding: 9px 14px; border-radius: 9px; font-weight: 500; font-size: 12.5px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); transition: transform 200ms var(--ease-out), opacity 200ms ease-out; pointer-events: none; z-index: 10; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .foot { text-align: center; color: var(--ink-3); font-size: 11.5px; padding-top: 4px; }
  .foot a { color: inherit; }
  .browser-tip a { color: var(--sel); font-weight: 600; }
  .browser-tip { display: flex; gap: 10px; align-items: flex-start; }
  .browser-tip svg { flex: none; margin-top: 1px; color: var(--sel); }

/*SITECSS*/
  /* Lenis */
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  .lenis.lenis-smooth [data-lenis-prevent] { overscroll-behavior: contain; }

  /* hover motion only where a real pointer can hover */
  @media (hover: hover) and (pointer: fine) {
    .drop:hover { border-style: solid; border-color: var(--sel); }
    .drop:hover .h { opacity: 1; }
    .drop:hover .ico { transform: translateY(-3px); }
    .go:hover:not(:disabled) { transform: translateY(-1px); }
    .go:hover:not(:disabled) .arrow { transform: translateX(3px); }
  }
  /* reduced motion: keep fades and colour, drop movement, keep a calm progress signal */
  @media (prefers-reduced-motion: reduce) {
    .step { animation-name: fade; }
    .badge { animation-name: fade; }
    @keyframes fade { from { opacity: 0; } }
    .pv .box::after { animation: none; transform: none; height: 100%; opacity: .5; }
    .phases li.now .st { animation-duration: 2.4s; }
    .drop.over, .drop.over .ico, .go:active:not(:disabled), .size:active { transform: none !important; }
    .toast { transform: translate(-50%, 0); }
    @media (hover: hover) and (pointer: fine) { .drop:hover .ico, .go:hover:not(:disabled), .go:hover:not(:disabled) .arrow { transform: none; } }
    .bar i, .switch span::after, details.tune summary svg { transition-duration: 1ms; }
  }
</style>
