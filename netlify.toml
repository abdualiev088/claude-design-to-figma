# Netlify runs build.py, which assembles the site from src/ into site/.
[build]
  publish = "site"
  command = "python3 build.py"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/claude-design-to-figma.zip"
  [headers.values]
    Content-Type = "application/zip"
    Content-Disposition = "attachment; filename=claude-design-to-figma.zip"
